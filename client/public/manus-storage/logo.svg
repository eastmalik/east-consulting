<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>East Consulting LLC compass rose</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c56d"/>
      <stop offset="1" stop-color="#e68d00"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="37" fill="none" stroke="url(#g)" stroke-width="3"/>
  <circle cx="50" cy="50" r="31" fill="none" stroke="#e68d00" stroke-width="1" opacity=".6"/>
  <!-- diagonal points -->
  <g id="d" transform="rotate(45 50 50)">
    <polygon points="50,21 45.5,45.5 50,50" fill="#f7c56d"/>
    <polygon points="50,21 54.5,45.5 50,50" fill="#d27500"/>
  </g>
  <use href="#d" transform="rotate(90 50 50)"/>
  <use href="#d" transform="rotate(180 50 50)"/>
  <use href="#d" transform="rotate(270 50 50)"/>
  <!-- cardinal points -->
  <g id="c">
    <polygon points="50,3 42,42 50,50" fill="#f7c56d"/>
    <polygon points="50,3 58,42 50,50" fill="#e68d00"/>
  </g>
  <use href="#c" transform="rotate(90 50 50)"/>
  <use href="#c" transform="rotate(180 50 50)"/>
  <use href="#c" transform="rotate(270 50 50)"/>
  <circle cx="50" cy="50" r="5" fill="#00112b" stroke="#f7c56d" stroke-width="2"/>
</svg>
