<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>East Consulting LLC north star</title>
  <defs>
    <!-- blue aura -->
    <radialGradient id="aura" cx="50" cy="50" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fbcff" stop-opacity="1"/>
      <stop offset=".3" stop-color="#3f7fff" stop-opacity=".85"/>
      <stop offset=".65" stop-color="#1f56e0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1f56e0" stop-opacity="0"/>
    </radialGradient>
    <!-- star: white centre, blue tips -->
    <radialGradient id="star" cx="50" cy="50" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#eef4ff"/>
      <stop offset=".7" stop-color="#7aa9ff"/>
      <stop offset="1" stop-color="#2a63e8"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#aura)"/>
  <!-- small diagonal points -->
  <path d="M50,16 L53.5,46.5 L84,50 L53.5,53.5 L50,84 L46.5,53.5 L16,50 L46.5,46.5 Z"
        fill="#dbe8ff" stroke="#2a63e8" stroke-width=".5" stroke-linejoin="round" transform="rotate(45 50 50)"/>
  <!-- main four points: north and south longer -->
  <path d="M50,1 C52,38 58,47 86,50 C58,53 52,62 50,99 C48,62 42,53 14,50 C42,47 48,38 50,1 Z"
        fill="url(#star)" stroke="#2a63e8" stroke-width=".6" stroke-linejoin="round"/>
  <circle cx="50" cy="50" r="3.2" fill="#ffffff"/>
</svg>
